<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><style>html,body{margin:0;padding:0;overflow:hidden;line-height:0;background:transparent}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 536" role="img" aria-label="短信自动复制设置流程动画" style="display:block;width:100%;height:auto;--accent:#ACCENT;font-family:system-ui,sans-serif">

  <linearGradient id="sms-front" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f2ffe6"/><stop offset="1" stop-color="#c8f9bd"/></linearGradient>
  <filter id="menu-shadow" x="-20%" y="-15%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#c4c4c4" flood-opacity=".18"/></filter>
  <rect id="app" width="120" height="120" rx="30" fill="#e8e8e8"/>

    <rect width="120" height="120" rx="30" fill="url(#sms-green)"/>
    <path d="M55 42h36q10 0 10 10v32q0 10-10 10h-7l17 12V94H55q-9 0-9-10V52q0-10 9-10Z" fill="#d5facb" opacity=".62"/>
    <path d="M27 20h45q10 0 10 10v31q0 10-10 10H42L20 84V30q0-10 7-10Z" fill="url(#sms-front)"/>
  </g>
  <g id="hand" fill="#fff" stroke="#161616" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 10V2a2 2 0 0 1 4 0v6a2 2 0 0 1 4 0 2 2 0 0 1 4 1 2 2 0 0 1 4 2v3q0 4-3 8H5l-7-8a2.3 2.3 0 0 1 2-4Z"/>
  </g>
  <g id="pointer"><g transform="rotate(-15) scale(3.25) translate(-2 0)"><use href="#hand"/></g></g>
  <g id="page-heading" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M99 77H54l20-18M54 77l20 18"/></g>
  <g id="next" fill="none" stroke="#d1d1d1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m0-9 9 9-9 9"/></g>
  <g id="settings-card">
    <rect x="40" y="156" width="624" height="338" rx="32" fill="#fff"/>
    <path d="M70 268h564M70 380h564" fill="none" stroke="#f6f6f6" stroke-width="3"/>
    <g fill="#f5f5f5"><rect x="70" y="184" width="136" height="25" rx="8"/><rect x="70" y="220" width="205" height="20" rx="7"/><rect x="70" y="409" width="136" height="25" rx="8"/><rect x="70" y="445" width="205" height="20" rx="7"/></g>
  </g>
  <g id="off-switch"><rect width="78" height="42" rx="21" fill="#e6e6e6"/><circle cx="21" cy="21" r="16" fill="#fff"/></g>
</defs>
<g clip-path="url(#viewport)">
 <rect width="704" height="536" fill="#f2f2f2"/>
 <g id="home" class="scene">
  <rect width="704" height="536" fill="#f2f2f2"/>
  <use href="#app" x="44" y="110"/><use href="#app" x="208" y="110"/><use href="#app" x="372" y="110"/><use href="#app" x="536" y="110"/>
  <use href="#app" x="44" y="300"/><use href="#app" x="208" y="300"/><use href="#app" x="372" y="300"/><use href="#app" x="536" y="300"/>
  <g transform="translate(208 300)"><use href="#sms-icon"/></g>
  <rect id="home-press" x="208" y="300" width="120" height="120" rx="30" fill="#000" opacity="0"/>
  <circle id="home-ripple" class="tap-glow" r="16" fill="#58cdb7" opacity="0"/>
  <use id="home-hand" href="#pointer"/>
 </g>
 <g id="messages" class="scene">
  <rect width="704" height="536" fill="#f2f2f2"/>
  <g stroke="#d2d2d2" stroke-width="4" fill="none"><circle cx="493" cy="64" r="17"/><path d="m506 77 12 12"/><rect x="548" y="47" width="15" height="15" rx="2"/><rect x="571" y="47" width="15" height="15" rx="2"/><rect x="548" y="70" width="15" height="15" rx="2"/><rect x="571" y="70" width="15" height="15" rx="2"/></g>
  <rect id="dots-press" x="615" y="28" width="48" height="74" rx="14" fill="#000" opacity="0"/>
  <g fill="#262626"><circle cx="639" cy="50" r="4"/><circle cx="639" cy="65" r="4"/><circle cx="639" cy="80" r="4"/></g>
  <text x="40" y="185" font-size="50" fill="#cecece">通知</text>
  <rect x="40" y="246" width="624" height="248" rx="32" fill="#fafafa"/>
  <g fill="#f5f5f5"><rect x="70" y="292" width="491" height="32" rx="8"/><rect x="70" y="365" width="214" height="32" rx="8"/></g>
  <circle id="dots-ripple" class="tap-glow" r="16" fill="#58cdb7" opacity="0"/>
  <use id="dots-hand" href="#pointer"/>
  <g id="more" filter="url(#menu-shadow)">
    <rect x="438" y="122" width="226" height="328" rx="32" fill="#fff"/>
    <g fill="#f6f6f6"><rect x="470" y="150" width="104" height="28" rx="8"/><rect x="470" y="232" width="104" height="28" rx="8"/><rect x="470" y="314" width="104" height="28" rx="8"/></g>
    <path d="M468 203h166M468 285h166M468 367h166" stroke="#fafafa" stroke-width="3"/>
    <rect id="menu-press" x="446" y="374" width="210" height="68" rx="24" fill="#e5e5e5" opacity="0"/>
    <text x="470" y="423" font-size="32" fill="#252525">设置</text>
  </g>
  <circle id="menu-ripple" class="tap-glow" r="16" fill="#58cdb7" opacity="0"/>
  <use id="menu-hand" href="#pointer"/>
 </g>
 <g id="settings" class="scene">
  <rect width="704" height="536" fill="#f2f2f2"/>
  <use href="#page-heading"/><text x="130" y="92" font-size="36" fill="#252525" font-weight="600">设置</text>
  <use href="#settings-card"/>
  <rect id="service-press" x="40" y="269" width="624" height="110" fill="#e2e2e2" opacity="0"/>
  <text x="70" y="331" font-size="30" fill="#252525">智能信息服务</text>
  <use href="#next" x="625" y="211"/><use href="#next" x="625" y="324"/><use href="#next" x="625" y="436"/>
  <circle id="service-ripple" class="tap-glow" r="16" fill="#58cdb7" opacity="0"/>
  <use id="service-hand" href="#pointer"/>
 </g>
 <g id="protection" class="scene">
  <rect width="704" height="536" fill="#f2f2f2"/>
  <use href="#page-heading"/><text x="130" y="92" font-size="36" fill="#252525" font-weight="600">智能信息服务</text>
  <use href="#settings-card"/>
  <text x="70" y="320" font-size="29" fill="#252525">验证码安全保护</text>
  <text x="70" y="353" font-size="24" fill="#a4a4a4">禁止第三方应用读取验证码</text>
  <use href="#off-switch" x="552" y="191"/><use href="#off-switch" x="552" y="416"/>
  <rect id="switch-track" x="552" y="303" width="78" height="42" rx="21" fill="var(--accent)"/>
  <circle id="switch-knob" cx="609" cy="324" r="16" fill="#fff"/>
  <rect id="switch-press" x="552" y="303" width="78" height="42" rx="21" fill="#000" opacity="0"/>
  <circle id="switch-ripple" class="tap-glow" r="16" fill="#58cdb7" opacity="0"/>
  <use id="switch-hand" href="#pointer"/>
 </g>
</g>
</svg><script>"use strict";
const duration=8900;
const scenes=['home','messages','settings','protection'].map(id=>document.getElementById(id));
const byId=id=>document.getElementById(id);
let running=false, position=0, frame=0, last=0;
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>(1-Math.cos(Math.PI*clamp(x)))/2;
function opacity(id,value){byId(id).setAttribute('opacity',value);}
function press(t,click,hold=220){
 const age=t-click;
 if(age<0||age>hold)return 0;
 return Math.min(ease(age/55),1-ease((age-hold+75)/75));
}
function pointer(id,t,start,click,end,x,y){
 const enter=ease((t-start)/220), leave=1-ease((t-end+140)/140);
 const visible=t<start||t>end?0:Math.min(enter,leave);
 const node=byId(id);node.setAttribute('opacity',visible);
 node.setAttribute('transform',`translate(${x+14*(1-enter)} ${y+22*(1-enter)})`);
 const ripple=byId(id.replace('-hand','-ripple')),age=t-click;
 const pulse=age>=0&&age<=330?Math.sin(Math.PI*age/330):0;
 ripple.setAttribute('cx',x);ripple.setAttribute('cy',y);
 ripple.setAttribute('r',16+18*clamp(age/330));
 ripple.setAttribute('opacity',visible*pulse*.6);
}
function render(time){
 position=((time%duration)+duration)%duration;const t=position;
 scenes.forEach(node=>node.setAttribute('transform','translate(704 0)'));
 let current=0,next=-1,slide=0;
 if(t<1100){current=0;}
 else if(t<1550){current=0;next=1;slide=ease((t-1100)/450);}
 else if(t<4200){current=1;}
 else if(t<4650){current=1;next=2;slide=ease((t-4200)/450);}
 else if(t<6000){current=2;}
 else if(t<6450){current=2;next=3;slide=ease((t-6000)/450);}
 else if(t<8400){current=3;}
 else{current=3;next=0;slide=ease((t-8400)/500);}
 scenes[current].setAttribute('transform',`translate(${-704*slide} 0)`);
 if(next>=0)scenes[next].setAttribute('transform',`translate(${704*(1-slide)} 0)`);
 pointer('home-hand',t,0,400,1050,269,372);
 pointer('dots-hand',t,1700,2250,2550,638,60);
 pointer('menu-hand',t,2800,3500,3960,551,403);
 pointer('service-hand',t,4800,5400,5850,416,336);
 pointer('switch-hand',t,6650,7280,7850,609,324);
 const menuIn=ease((t-2280)/340),menuOut=1-ease((t-4020)/160);
 opacity('more',t<2280||t>4180?0:Math.min(menuIn,menuOut));
 byId('more').setAttribute('transform',`translate(0 ${-8*(1-menuIn)})`);
 opacity('home-press',.15*press(t,400));
 opacity('dots-press',.13*press(t,2250));
 opacity('menu-press',press(t,3500));
 opacity('service-press',press(t,5400));
 opacity('switch-press',.16*press(t,7280));
 const toggle=ease((t-7350)/300);
 byId('switch-track').setAttribute('fill',toggle>=.98?'#e6e6e6':'var(--accent)');
 byId('switch-knob').setAttribute('cx',609-36*toggle);
}
function advance(now){if(last)render(position+now-last);last=now;frame=requestAnimationFrame(advance);}
function pause(){running=false;cancelAnimationFrame(frame);last=0;}
function resume(){if(running)return;running=true;last=0;frame=requestAnimationFrame(advance);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else resume();});
render(0);resume();</script></body></html>
